<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Braid Visualization Dev Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 1.5rem;
      color: #fff;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .global-controls {
      background: #16213e;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .control-group label {
      font-size: 0.75rem;
      color: #aaa;
      text-transform: uppercase;
    }
    .control-group input[type="range"] {
      width: 100px;
    }
    .control-group input[type="number"],
    .control-group select {
      width: 70px;
      padding: 4px 8px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0f3460;
      color: #fff;
      font-size: 0.85rem;
    }
    .control-group .value-display {
      font-size: 0.8rem;
      color: #4ecca3;
      font-weight: bold;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background: #4ecca3;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.85rem;
    }
    button:hover {
      background: #45b393;
    }
    button.secondary {
      background: #0f3460;
      color: #fff;
    }
    button.secondary:hover {
      background: #1a4a7a;
    }
    button.small {
      padding: 4px 10px;
      font-size: 0.75rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 15px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .card {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card h3 {
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #fff;
    }
    .card canvas {
      background: #f8f9fa;
      border-radius: 4px;
      width: 100%;
      max-width: 280px;
      height: 180px;
    }
    .card .controls {
      background: #0f3460;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .card .controls .control-row {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: space-between;
    }
    .card .controls label {
      font-size: 0.7rem;
      color: #aaa;
      min-width: 50px;
    }
    .card .controls input[type="range"] {
      flex: 1;
      width: 80px;
    }
    .card .controls input[type="number"] {
      width: 50px;
      padding: 2px 4px;
      font-size: 0.8rem;
    }
    .card .controls .value-display {
      font-size: 0.75rem;
      color: #4ecca3;
      font-weight: bold;
      min-width: 35px;
      text-align: right;
    }
    .card .info {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #888;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card .info span {
      background: #0f3460;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .formula {
      background: #0f3460;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-family: 'Consolas', monospace;
      font-size: 0.85rem;
      text-align: center;
      color: #4ecca3;
      line-height: 1.5;
    }
    .formula code {
      color: #ffd93d;
    }
    .card-buttons {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>🧵 Braid Visualization Dev Tool</h1>
  <p class="subtitle">Per-card parameter tuning for each thread count (Fixed strand width)</p>

  <div class="formula" id="formula-display">
    radius = <code id="disp-rad-base">7.5</code> × (nThreads / 8) ^ <code id="disp-rad-exp">0.70</code><br>
    pitch = radius × <code id="disp-pitch-ratio">0.159</code> × (nThreads / 8) ^ <code id="disp-pitch-exp">0.30</code>
  </div>

  <div class="global-controls">
    <div class="control-group">
      <label>Canvas Height</label>
      <input type="number" id="canvas-height" min="100" max="300" step="10" value="180">
    </div>
    <div class="control-group">
      <label>Strand Width (Fixed)</label>
      <input type="number" id="global-strand-width" min="1" max="15" step="0.5" value="6">
    </div>
    <button id="btn-copy-from-prev">Copy from Previous</button>
    <button id="btn-copy-all">Copy First to All</button>
    <button class="secondary" id="btn-reset">Reset All</button>
  </div>

  <div class="grid" id="grid"></div>

  <script type="module">
    import { KumihimoDisk } from './src/engine/kumihimo.js';

    // Thread color palette
    const COLOR_PALETTE = [
      '#e63946', '#f4a261', '#2a9d8f', '#264653',
      '#e76f51', '#f28482', '#84a59d', '#f2cc8f',
      '#6a994e', '#bc4749', '#386641', '#540b0e',
      '#6930c3', '#5e60ce', '#5390d9', '#4ea8de',
      '#48cae4', '#90e0ef', '#ade8f4', '#caf0f8',
      '#ff9e00', '#ff6d00', '#ff3d00', '#d50000',
      '#aa00ff', '#651fff', '#304ffe', '#00b0ff',
    ];

    const TEST_CONFIGS = [8, 12, 16, 20, 24, 28, 32];

    // Default parameters
    const DEFAULTS = {
      radiusBase: 7.5,
      radiusExponent: 0.70,
      pitchRatio: 1.19 / 7.5,
      pitchExponent: 0.30,
      lightingMin: 0.52,
      lightingRange: 0.48,
    };

    let canvasHeight = 180;
    let globalStrandWidth = 6.0; 
    let cardStates = {};

    function initCardStates() {
      cardStates = {};
      TEST_CONFIGS.forEach(nThreads => {
        cardStates[nThreads] = { ...DEFAULTS };
      });
    }

    const grid = document.getElementById('grid');
    const canvasHeightInput = document.getElementById('canvas-height');
    const globalStrandWidthInput = document.getElementById('global-strand-width');
    const btnCopyFromPrev = document.getElementById('btn-copy-from-prev');
    const btnCopyAll = document.getElementById('btn-copy-all');
    const btnReset = document.getElementById('btn-reset');
    
    // Formula display elements
    const dispRadBase = document.getElementById('disp-rad-base');
    const dispRadExp = document.getElementById('disp-rad-exp');
    const dispPitchRatio = document.getElementById('disp-pitch-ratio');
    const dispPitchExp = document.getElementById('disp-pitch-exp');

    // Helper Functions
    function adjustColorBrightness(hex, factor) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const nr = Math.min(255, Math.round(r * factor));
      const ng = Math.min(255, Math.round(g * factor));
      const nb = Math.min(255, Math.round(b * factor));
      return `#${nr.toString(16).padStart(2, '0')}${ng.toString(16).padStart(2, '0')}${nb.toString(16).padStart(2, '0')}`;
    }

    function calculateRadius(nThreads, params) {
      return params.radiusBase * Math.pow(nThreads / 8, params.radiusExponent);
    }

    function calculatePitch(nThreads, radius, params) {
      return radius * params.pitchRatio * Math.pow(nThreads / 8, params.pitchExponent);
    }

    // Drawing Braid
    function drawBraidPreview(canvas, nThreads, radius, pitch, params) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(0, 0, width, height);

      const threadColors = [];
      for (let i = 0; i < nThreads; i++) {
        threadColors.push(COLOR_PALETTE[i % COLOR_PALETTE.length]);
      }

      const disk = new KumihimoDisk(nThreads);
      disk.init(threadColors);

      const simSteps = Math.min(120, 80);
      for (let s = 0; s < simSteps; s++) {
        disk.weaveRowFast();
      }

      if (disk.productColors.length <= 1) return;

      const startY = 16;
      const hangerY = 15;
      const hangerR = Math.max(5, radius * 0.4);
      const knotW = Math.max(2, radius * 0.25);

      ctx.save();
      ctx.translate(width / 2, 0);

      // Draw hanger
      ctx.beginPath();
      ctx.arc(0, hangerY, hangerR, 0, 2 * Math.PI);
      ctx.fillStyle = '#8a7e72';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-knotW, 0);
      ctx.lineTo(-knotW, hangerY);
      ctx.moveTo(knotW, 0);
      ctx.lineTo(knotW, hangerY);
      ctx.strokeStyle = '#a69c91';
      ctx.lineWidth = knotW;
      ctx.stroke();

      const maxVisibleRows = Math.floor((height - 40) / pitch);
      const endRowIdx = Math.min(disk.productColors.length, maxVisibleRows);

      const segments = [];
      for (let r = 1; r < endRowIdx; r++) {
        const prevRow = disk.productColors[r - 1];
        const currRow = disk.productColors[r];
        const prevY = startY + (r - 1) * pitch;
        const currY = startY + r * pitch;

        for (let i = 0; i < disk.nThreads; i++) {
          const prevThread = prevRow[i];
          const currThread = currRow[i];
          if (!prevThread || !currThread) continue;

          const prevTheta = (prevThread.slot * 2 * Math.PI) / disk.slotsCount - Math.PI / 2;
          const currTheta = (currThread.slot * 2 * Math.PI) / disk.slotsCount - Math.PI / 2;

          let diff = currTheta - prevTheta;
          while (diff < -Math.PI) diff += 2 * Math.PI;
          while (diff > Math.PI) diff -= 2 * Math.PI;
          const adjustedCurrTheta = prevTheta + diff;

          const prevX = radius * Math.sin(prevTheta);
          const prevZ = radius * Math.cos(prevTheta);
          const currX = radius * Math.sin(adjustedCurrTheta);
          const currZ = radius * Math.cos(adjustedCurrTheta);

          if (prevZ > -radius * 0.7 || currZ > -radius * 0.7) {
            const avgZ = (prevZ + currZ) / 2;
            segments.push({
              color: currThread.color,
              fx: prevX,
              fy: prevY,
              tx: currX,
              ty: currY,
              avgZ,
              prevZ,
              currZ
            });
          }
        }
      }

      segments.sort((a, b) => a.avgZ - b.avgZ);

      segments.forEach(seg => {
        ctx.beginPath();
        ctx.moveTo(seg.fx, seg.fy);
        ctx.lineTo(seg.tx, seg.ty);

        const lightingFactor = params.lightingMin + params.lightingRange * ((seg.avgZ + radius) / (2 * radius));
        const shadedColor = adjustColorBrightness(seg.color, lightingFactor);

        ctx.lineWidth = globalStrandWidth; 
        ctx.lineCap = 'round';
        ctx.strokeStyle = shadedColor;
        ctx.shadowColor = 'rgba(0,0,0,0.18)';
        ctx.shadowBlur = 2.5;
        ctx.shadowOffsetY = 1;
        ctx.stroke();
      });

      ctx.restore();
    }

    function createCard(nThreads) {
      const card = document.createElement('div');
      card.className = 'card';

      const title = document.createElement('h3');
      title.textContent = `${nThreads} Threads`;
      card.appendChild(title);

      const canvas = document.createElement('canvas');
      canvas.width = 280;
      canvas.height = canvasHeight;
      card.appendChild(canvas);

      const controls = document.createElement('div');
      controls.className = 'controls';

      const params = cardStates[nThreads];

      function createControlRow(label, key, min, max, step) {
        const row = document.createElement('div');
        row.className = 'control-row';

        const lbl = document.createElement('label');
        lbl.textContent = label;
        row.appendChild(lbl);

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = min;
        slider.max = max;
        slider.step = step;
        slider.value = params[key];
        
        const val = document.createElement('span');
        val.className = 'value-display';
        val.textContent = params[key].toFixed(3);

        slider.addEventListener('input', (e) => {
          params[key] = parseFloat(e.target.value);
          val.textContent = params[key].toFixed(3);
          renderCard(nThreads);
        });
        
        row.appendChild(slider);
        row.appendChild(val);

        return row;
      }

      controls.appendChild(createControlRow('Rad Base', 'radiusBase', 5, 40, 0.5));
      controls.appendChild(createControlRow('Rad Exp', 'radiusExponent', 0.1, 1.5, 0.05));
      controls.appendChild(createControlRow('Pitch Ratio', 'pitchRatio', 0.05, 0.3, 0.001));
      controls.appendChild(createControlRow('Pitch Exp', 'pitchExponent', 0.1, 1.5, 0.05));
      controls.appendChild(createControlRow('Light Min', 'lightingMin', 0.3, 0.7, 0.05));
      controls.appendChild(createControlRow('Light Range', 'lightingRange', 0.3, 0.6, 0.05));

      card.appendChild(controls);

      const info = document.createElement('div');
      info.className = 'info';
      card.appendChild(info);

      const buttons = document.createElement('div');
      buttons.className = 'card-buttons';

      const btnCopyPrev = document.createElement('button');
      btnCopyPrev.className = 'small secondary';
      btnCopyPrev.textContent = '← Prev';
      btnCopyPrev.addEventListener('click', () => copyFromPrevious(nThreads));
      buttons.appendChild(btnCopyPrev);

      const btnCopyNext = document.createElement('button');
      btnCopyNext.className = 'small secondary';
      btnCopyNext.textContent = 'Next →';
      btnCopyNext.addEventListener('click', () => copyToNext(nThreads));
      buttons.appendChild(btnCopyNext);

      const btnResetCard = document.createElement('button');
      btnResetCard.className = 'small secondary';
      btnResetCard.textContent = 'Reset';
      btnResetCard.addEventListener('click', () => {
        cardStates[nThreads] = { ...DEFAULTS };
        const inputs = card.querySelectorAll('input[type="range"]');
        const displays = card.querySelectorAll('.value-display');
        let i = 0;
        for (const key in DEFAULTS) {
            inputs[i].value = DEFAULTS[key];
            displays[i].textContent = DEFAULTS[key].toFixed(3);
            i++;
        }
        renderCard(nThreads);
      });
      buttons.appendChild(btnResetCard);

      card.appendChild(buttons);

      return card;
    }

    function renderCard(nThreads) {
      const card = grid.querySelector(`[data-nthreads="${nThreads}"]`);
      if (!card) return;

      const canvas = card.querySelector('canvas');
      const info = card.querySelector('.info');
      
      const params = cardStates[nThreads];
      
      const radius = calculateRadius(nThreads, params);
      const pitch = calculatePitch(nThreads, radius, params);

      drawBraidPreview(canvas, nThreads, radius, pitch, params);

      // 여기에 radiusExponent와 pitchExponent 디스플레이 추가
      info.innerHTML = `
        <span>Radius: <strong>${radius.toFixed(1)}px</strong></span>
        <span>Pitch: <strong>${pitch.toFixed(2)}px</strong></span>
        <span>Rad Exp: <strong>${params.radiusExponent.toFixed(2)}</strong></span>
        <span>Pitch Exp: <strong>${params.pitchExponent.toFixed(2)}</strong></span>
        <span>Rows: <strong>${Math.floor((canvasHeight - 40) / pitch)}</strong></span>
      `;
    }

    function renderGrid() {
      grid.innerHTML = '';
      TEST_CONFIGS.forEach(nThreads => {
        const card = createCard(nThreads);
        card.dataset.nthreads = nThreads;
        grid.appendChild(card);
        renderCard(nThreads);
      });

      updateFormulaDisplay();
    }
    
    function updateFormulaDisplay() {
      const firstParams = cardStates[TEST_CONFIGS[0]];
      dispRadBase.textContent = firstParams.radiusBase.toFixed(1);
      dispRadExp.textContent = firstParams.radiusExponent.toFixed(2);
      dispPitchRatio.textContent = firstParams.pitchRatio.toFixed(3);
      dispPitchExp.textContent = firstParams.pitchExponent.toFixed(2);
    }

    function copyFromPrevious(nThreads) {
      const idx = TEST_CONFIGS.indexOf(nThreads);
      if (idx <= 0) return;
      const prevN = TEST_CONFIGS[idx - 1];
      cardStates[nThreads] = { ...cardStates[prevN] };
      renderGrid(); 
    }

    function copyToNext(nThreads) {
      const idx = TEST_CONFIGS.indexOf(nThreads);
      if (idx < 0 || idx >= TEST_CONFIGS.length - 1) return;
      const nextN = TEST_CONFIGS[idx + 1];
      cardStates[nextN] = { ...cardStates[nThreads] };
      renderGrid(); 
    }

    function copyFirstToAll() {
      const firstParams = { ...cardStates[TEST_CONFIGS[0]] };
      TEST_CONFIGS.forEach(n => {
        cardStates[n] = { ...firstParams };
      });
      renderGrid();
    }

    function resetAll() {
      initCardStates();
      renderGrid();
    }

    // Global Event listeners
    canvasHeightInput.addEventListener('input', (e) => {
      canvasHeight = parseInt(e.target.value) || 180;
      TEST_CONFIGS.forEach(n => renderCard(n));
    });
    
    globalStrandWidthInput.addEventListener('input', (e) => {
      globalStrandWidth = parseFloat(e.target.value) || 6;
      TEST_CONFIGS.forEach(n => renderCard(n));
    });

    btnCopyFromPrev.addEventListener('click', () => {
      for (let i = 1; i < TEST_CONFIGS.length; i++) {
        cardStates[TEST_CONFIGS[i]] = { ...cardStates[TEST_CONFIGS[i - 1]] };
      }
      renderGrid();
    });

    btnCopyAll.addEventListener('click', copyFirstToAll);
    btnReset.addEventListener('click', resetAll);

    // Initialize
    initCardStates();
    renderGrid();
  </script>
</body>
</html>
