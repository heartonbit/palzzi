<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snapshot Debug</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .card h3 { margin: 0 0 8px; font-size: 14px; color: #333; }
    .card .meta { font-size: 12px; color: #888; margin-bottom: 8px; }
    .card img { width: 320px; height: 200px; object-fit: cover; border: 1px solid #ddd; border-radius: 4px; display: block; margin-bottom: 4px; }
    .card .label { font-size: 11px; color: #666; margin-bottom: 2px; }
    .card .no-snap { width: 320px; height: 200px; background: #eee; display: flex; align-items: center; justify-content: center; color: #aaa; border-radius: 4px; margin-bottom: 4px; }
    .actions { margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
    button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background: #2a9d8f; color: #fff; }
    button:hover { opacity: .85; }
    #status { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <h1>🔍 snapshotBase64 Debug</h1>
  <div class="actions">
    <button onclick="loadSnapshots()">다시 불러오기</button>
    <span id="status">로딩 중...</span>
  </div>
  <div id="grid" class="grid"></div>

  <script type="module">
    import { db } from './src/firebase/config.js';
    import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    window.loadSnapshots = async function() {
      const grid = document.getElementById('grid');
      const status = document.getElementById('status');
      grid.innerHTML = '';
      status.textContent = '로딩 중...';

      try {
        const snap = await getDocs(collection(db, 'patterns'));
        const patterns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        status.textContent = `총 ${patterns.length}개 패턴`;

        for (const p of patterns) {
          const card = document.createElement('div');
          card.className = 'card';

          const name = p.nameKo || p.templateName || p.id;
          const threads = p.nThreads || '?';
          const hasNew = !!p.snapshotBase64;
          const hasOld = !!p.snapshotUrl;

          card.innerHTML = `
            <h3>${name}</h3>
            <div class="meta">${threads}줄 · ${p.templateId || ''} · id: ${p.id.slice(0,8)}…</div>
            <div class="label">snapshotBase64 ${hasNew ? '✅' : '❌'}</div>
            ${hasNew
              ? `<img src="${p.snapshotBase64}" alt="snapshotBase64">`
              : `<div class="no-snap">no snapshotBase64</div>`}
            <div class="label" style="margin-top:8px;">snapshotUrl (legacy) ${hasOld ? '⚠️ 존재' : '✅ 없음'}</div>
            ${hasOld
              ? `<img src="${p.snapshotUrl}" alt="snapshotUrl">`
              : ''}
          `;
          grid.appendChild(card);
        }
      } catch (err) {
        status.textContent = '오류: ' + err.message;
        console.error(err);
      }
    };

    loadSnapshots();
  </script>
</body>
</html>
