<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">Palzzi (팔찌) - 쿠미히모 2D 시뮬레이터</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- App Wrapper -->
  <div class="app-container">
    
    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="logo-group">
        <div class="logo">
          <i class="fa-solid fa-circle-nodes"></i>
          <h1><span class="logo-text" data-i18n="logoTitle">Palzzi</span></h1>
        </div>
        <!-- Language Selector Toggle -->
        <div class="lang-selector">
          <button id="btn-lang-ko" class="lang-btn active">KO</button>
          <button id="btn-lang-en" class="lang-btn">EN</button>
        </div>
      </div>
      <div class="header-actions">
        <div id="auth-area" class="auth-area">
          <!-- Auth UI dynamically populated by main.js -->
        </div>
        <a href="/" class="btn btn-secondary" id="btn-gallery" title="패턴 갤러리 / Pattern Gallery">
          <i class="fa-solid fa-images"></i> <span data-i18n="galleryLink">갤러리</span>
        </a>
        <div class="dropdown">
          <!--
          <button id="btn-export-dropdown" class="btn btn-primary" title="내보내기 / Export">
            <i class="fa-solid fa-download"></i> <span data-i18n="exportLabel">내보내기</span> <i class="fa-solid fa-chevron-down" style="font-size:10px;margin-left:4px"></i>
          </button>
          -->
          <div id="export-dropdown-menu" class="dropdown-menu hidden">
            <button id="btn-export-png-braid" class="dropdown-item">
              <i class="fa-solid fa-image"></i> <span data-i18n="pngBraid">완성본 (PNG)</span>
            </button>
            <button id="btn-export-png-chart" class="dropdown-item">
              <i class="fa-solid fa-table"></i> <span data-i18n="pngChart">도안 (PNG)</span>
            </button>
            <button id="btn-export-json" class="dropdown-item">
              <i class="fa-solid fa-file-code"></i> <span data-i18n="jsonSave">JSON 저장</span>
            </button>
            <button id="btn-import-json-trigger" class="dropdown-item">
              <i class="fa-solid fa-file-import"></i> <span data-i18n="jsonLoad">JSON 불러오기</span>
            </button>
          </div>
        </div>
        <input type="file" id="input-import-json" accept=".json" style="display: none;">
      </div>
    </header>

    <!-- Main Workspace Area -->
    <main class="workspace">

      <!-- Left Gallery Sidebar -->
      <aside class="gallery-sidebar">
        <div class="sidebar-header">
          <h3 data-i18n="sidebarTitle"><i class="fa-solid fa-images"></i> 패턴 갤러리</h3>
        </div>
        <div class="sidebar-list" id="sidebar-pattern-list">
          <!-- Pattern cards dynamically populated by main.js -->
          <div class="sidebar-sentinel" id="sidebar-sentinel"></div>
          <div class="sidebar-loading hidden" id="sidebar-loading">
            <i class="fa-solid fa-spinner fa-spin"></i> <span data-i18n="sidebarLoading">불러오는 중...</span>
          </div>
        </div>
      </aside>

      <!-- Center Simulator Panel -->
      <section class="workspace-center">

        <!-- Template Selector Bar (merged from sidebar) -->
        <div class="template-bar">
          <select id="template-select" class="form-control">
            <!-- Dynamically populated from templates.js -->
          </select>
          <span id="template-desc" class="template-desc-inline"></span>
          <span id="meta-threads" class="tag"><i class="fa-solid fa-braille"></i> 8 가닥</span>
        </div>

        <!-- 2D Disk Display Panel -->
        <div class="disk-canvas-container">
          <canvas id="disk-canvas" width="480" height="480"></canvas>
          <!-- Color Popup (appears near clicked thread) -->
          <div id="color-popup" class="color-popup hidden">
            <div class="popup-header">
              <span id="popup-title" data-i18n="popupTitle">실 색상 선택</span>
              <button id="popup-close" class="popup-close-btn">&times;</button>
            </div>
            <div id="popup-presets" class="popup-presets">
              <!-- Dynamically populated with preset color circles -->
            </div>
            <div class="popup-divider"></div>
            <div class="popup-custom">
              <div class="popup-picker-row">
                <input type="color" id="popup-color-picker" value="#FF5733">
                <input type="text" id="popup-color-hex" class="form-control popup-hex-input" value="#FF5733" maxlength="7">
              </div>
              <div class="popup-name-row">
                <input type="text" id="popup-color-name" class="form-control popup-name-input" data-i18n-placeholder="popupNamePlaceholder" placeholder="새 색상 이름" maxlength="20">
                <button id="popup-save-btn" class="btn btn-sm btn-success" data-i18n="popupSaveBtn">저장</button>
              </div>
            </div>
          </div>

          <!-- Weave Button + Settings -->
          <div class="weave-button-container">
            <button id="btn-weave" class="btn-weave" title="Weave / 직조">
              <i class="fa-solid fa-arrows-spin"></i> Weave
            </button>
            <button id="btn-settings" class="btn btn-secondary btn-settings-inline" title="설정 / Settings">
              <i class="fa-solid fa-gear"></i>
            </button>
          </div>

          <!-- Action buttons (top-right of disk area) -->
          <div class="disk-action-buttons">
            <button id="btn-save-gallery" class="btn btn-success" title="갤러리에 저장 / Save to Gallery">
              <i class="fa-solid fa-cloud-arrow-up"></i> <span data-i18n="saveGalleryBtn">저장</span>
            </button>
            <button id="btn-share-url" class="btn btn-warning" title="공유 링크 복사 / Copy Share URL">
              <i class="fa-solid fa-share-nodes"></i> <span data-i18n="shareUrlBtn">공유</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Right/Bottom Dual View Panel -->
      <aside class="dual-viewer">
        <!-- Tab Headers -->
        <div class="view-tabs">
          <button class="view-tab active" data-tab="finished"><i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="tabVirtualBraid">3D 가상 완성본 2D 뷰</span></button>
          <button class="view-tab" data-tab="chart"><i class="fa-solid fa-table"></i> <span data-i18n="tabPatternChart">기호 도안 차트 (Pattern Chart)</span></button>
        </div>

        <!-- Tab Contents -->
        <div class="view-contents">
          <!-- Finished Virtual view -->
          <div id="tab-finished" class="tab-content active">
            <div class="canvas-wrapper">
              <canvas id="braid-canvas" width="320" height="500"></canvas>
            </div>
          </div>

          <!-- Pattern chart view -->
          <div id="tab-chart" class="tab-content">
            <div class="canvas-wrapper chart-scrollable">
              <canvas id="chart-canvas" width="320" height="500"></canvas>
            </div>
          </div>
        </div>
      </aside>

    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-content settings-modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-gear"></i> <span data-i18n="settingsTitle">설정</span></h3>
        <button id="settings-close" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">

        <!-- Braid Display Settings -->
        <section class="settings-section">
          <h4 data-i18n="settingsDisplay"><i class="fa-solid fa-eye"></i> 브레이드 표시 설정</h4>
          <div class="settings-row">
            <label for="settings-braid-zoom" data-i18n="zoomLabel">화면 배율:</label>
            <div class="settings-slider-row">
              <input type="range" id="settings-braid-zoom" min="0.4" max="1.5" step="0.05" value="0.70" class="zoom-slider">
              <span id="settings-braid-zoom-val" class="zoom-value">70%</span>
            </div>
          </div>
          <div class="settings-row">
            <label for="settings-pitch" data-i18n="pitchLabel">땋임 촘촘함:</label>
            <div class="settings-slider-row">
              <input type="range" id="settings-pitch" min="1.5" max="12.0" step="0.1" value="3.5" class="zoom-slider">
              <span id="settings-pitch-val" class="zoom-value">3.5</span>
            </div>
          </div>
          <div class="settings-row">
            <label for="settings-strand-width" data-i18n="strandWidthLabel">실 굵기:</label>
            <div class="settings-slider-row">
              <input type="range" id="settings-strand-width" min="0.3" max="1.2" step="0.05" value="0.6" class="zoom-slider">
              <span id="settings-strand-width-val" class="zoom-value">0.60</span>
            </div>
          </div>
        </section>


      </div>
      <div id="toast-message" class="toast hidden">상태 메시지</div>
    </div>
  </div>

  <!-- Preset Management Modal -->
  <div id="preset-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-palette"></i> <span data-i18n="presetModalTitle">컬러 프리셋 관리</span></h3>
        <button id="modal-close" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Left Side: Add / Edit Form -->
        <div class="modal-form">
          <h4 id="form-title" data-i18n="presetFormTitleAdd">새 프리셋 추가</h4>
          <div class="form-group">
            <label for="modal-preset-hex" data-i18n="presetColorLabel">색상 선택 (Color Picker)</label>
            <div class="picker-row">
              <input type="color" id="modal-preset-color" value="#007AFF">
              <input type="text" id="modal-preset-hex" class="form-control" value="#007AFF" maxlength="7">
            </div>
          </div>
          
          <div class="form-group">
            <label for="modal-preset-name" data-i18n="presetNameLabel">색상 이름</label>
            <input type="text" id="modal-preset-name" class="form-control" data-i18n-placeholder="presetNamePlaceholder" placeholder="예: 아쿠아 블루" value="애플 블루">
          </div>
          
          <div class="form-actions-row">
            <button id="btn-modal-save" class="btn btn-primary w-100" data-i18n="presetSaveBtn">저장</button>
            <button id="btn-modal-cancel-edit" class="btn btn-secondary w-100 mt-2 hidden" data-i18n="presetCancelEditBtn">수정 취소</button>
          </div>
        </div>

        <!-- Right Side: Preset List -->
        <div class="modal-list-wrapper">
          <h4 data-i18n="presetListTitle">프리셋 목록</h4>
          <div id="modal-preset-list" class="modal-preset-list">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-modal-close-done" class="btn btn-success" data-i18n="presetModalCloseDone">완료 및 닫기</button>
      </div>
    </div>
  </div>

  <!-- Web Application Scripts -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
