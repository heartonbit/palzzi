<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Palzzi — 쿠미히모 팔찌 패턴 갤러리. 사용자들의 쿠미히모 디자인을 구경하고, 나만의 패턴도 만들어 보세요.">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Palzzi - 쿠미히모 패턴 갤러리">
  <meta property="og:description" content="사용자들이 디자인한 쿠미히모 팔찌 패턴을 구경하고, 나만의 패턴도 만들어 보세요.">
  <meta property="og:image" content="/palzzi_logo.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/favicon.ico">
  <title data-i18n="galleryTitle">Palzzi - 쿠미히모 패턴 갤러리</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="gallery-style.css">
</head>
<body>
  <div class="app-container">

    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="logo-group">
        <a href="/" class="logo-link">
          <div class="logo">
            <img src="/logo.png" alt="Palzzi" class="logo-img">
            <h1><span class="logo-text" data-i18n="logoTitle">Palzzi</span></h1>
          </div>
        </a>
        <div class="lang-selector" id="lang-selector">
          <button id="btn-lang-toggle" class="btn-lang-globe" title="Language">
            <i class="fa-solid fa-globe"></i>
          </button>
          <div class="lang-popup hidden" id="lang-popup">
            <button id="btn-lang-ko" class="lang-option active">한국어</button>
            <button id="btn-lang-en" class="lang-option">English</button>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <div id="auth-area" class="auth-area">
          <!-- Auth UI dynamically populated by gallery.js -->
        </div>
        <a href="/admin" class="btn-admin-link hidden" id="btn-admin-link" title="관리자 페이지">
          <i class="fa-solid fa-shield-halved"></i>
        </a>
        <button class="btn-create-sim" id="btn-create-new" title="Create in Palzzi">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
    </header>

    <!-- Gallery Workspace -->
    <main class="workspace">

      <!-- Gallery Grid Area -->
      <section class="gallery-area">
        <div class="gallery-header">
          <h2 data-i18n="galleryHeading"><i class="fa-solid fa-images"></i> 쿠미히모 패턴 갤러리</h2>
          <p class="gallery-subtitle" data-i18n="gallerySubtitle">Firebase에 저장된 쿠미히모 패턴을 감상하고 클릭하여 상세 정보를 확인하세요.</p>
          <div class="gallery-sort-row">
            <select id="gallery-style-filter" class="gallery-sort-select">
              <option value="all" data-i18n="filterAll">전체</option>
              <option value="kumihimo" data-i18n="filterKumihimo">쿠미히모</option>
              <option value="misanga" data-i18n="filterMisanga">미산가</option>
            </select>
            <select id="gallery-sort" class="gallery-sort-select">
              <option value="newest" data-i18n="sortNewest">최신순</option>
              <option value="mostLiked" data-i18n="sortMostLiked">좋아요 많은 순</option>
            </select>
          </div>
        </div>

        <!-- Loading / Empty states -->
        <div id="gallery-loading" class="gallery-state">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <p data-i18n="loadingPatterns">패턴을 불러오는 중...</p>
        </div>
        <div id="gallery-empty" class="gallery-state hidden">
          <i class="fa-solid fa-folder-open"></i>
          <p data-i18n="noPatterns">아직 저장된 패턴이 없습니다.</p>
          <a href="/simulator" class="btn btn-primary" data-i18n="createFirst">
            <i class="fa-solid fa-plus"></i> 첫 패턴 만들기
          </a>
        </div>

        <!-- Gallery Grid -->
        <div id="gallery-grid" class="gallery-grid hidden">
          <!-- Dynamically populated pattern cards -->
        </div>
      </section>

      <!-- Detail Panel (slides in from right on card click) -->
      <aside id="detail-panel" class="detail-panel hidden">
        <div class="detail-header">
          <h3 data-i18n="detailTitle">패턴 상세 정보</h3>
          <button id="btn-close-detail" class="btn-close-detail" title="닫기">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="detail-body">
          <!-- Pattern preview canvas -->
          <div class="detail-preview">
            <canvas id="detail-canvas" width="320" height="200"></canvas>
            <button id="btn-detail-like" class="detail-like-btn" title="Like" aria-label="Like">
              <i class="fa-regular fa-heart"></i>
            </button>
          </div>
          <div class="detail-like-info">
            <span id="detail-like-count" class="detail-like-count">
              <i class="fa-solid fa-heart"></i> <span>0</span>
            </span>
          </div>
          <!-- Pattern metadata -->
          <div class="detail-meta">
            <div class="meta-row">
              <span class="meta-label" data-i18n="metaPatternName">패턴 이름</span>
              <span id="detail-name" class="meta-value">-</span>
            </div>
            <div class="meta-row">
              <span class="meta-label" data-i18n="metaThreads">가닥 수</span>
              <span id="detail-threads" class="meta-value">-</span>
            </div>
            <div class="meta-row">
              <span class="meta-label" data-i18n="metaCreator">만든 이</span>
              <span id="detail-creator" class="meta-value">-</span>
            </div>
            <div class="meta-row">
              <span class="meta-label" data-i18n="metaCreatedAt">생성일</span>
              <span id="detail-created" class="meta-value">-</span>
            </div>
          </div>
          <!-- Color swatches -->
          <div class="detail-colors">
            <h4 data-i18n="colorSwatches">사용 색상</h4>
            <div id="detail-color-list" class="color-swatches">
              <!-- Dynamically populated -->
            </div>
          </div>
          <!-- Actions -->
          <div class="detail-actions">
            <button id="btn-load-simulator" class="btn btn-primary w-100">
              <i class="fa-solid fa-arrows-spin"></i> <span data-i18n="loadToSimulator">Open in Palzzi</span>
            </button>
            <button id="btn-delete-pattern" class="btn btn-danger w-100 mt-2">
              <i class="fa-solid fa-trash"></i> <span data-i18n="deletePattern">패턴 삭제</span>
            </button>
          </div>
        </div>
      </aside>

    </main>

    <!-- Create Type Modal -->
    <div id="create-modal" class="modal-overlay hidden">
      <div class="create-modal-content">
        <div class="modal-header">
          <h3 data-i18n="createModalTitle"><i class="fa-solid fa-wand-magic-sparkles"></i> 팔찌 만들기</h3>
          <button id="create-modal-close" class="modal-close-btn">&times;</button>
        </div>
        <div class="create-modal-body">
          <a href="/simulator" class="create-type-card" id="create-kumihimo">
            <div class="create-type-icon"><i class="fa-solid fa-circle-notch"></i></div>
            <div class="create-type-info">
              <h4 data-i18n="createKumihimo">쿠미히모</h4>
              <p data-i18n="createKumihimoDesc">원형 디스크로 짜는 전통 브레이드</p>
            </div>
          </a>
          <a href="/misanga" class="create-type-card" id="create-misanga">
            <div class="create-type-icon"><i class="fa-solid fa-grip-lines"></i></div>
            <div class="create-type-info">
              <h4 data-i18n="createMisanga">미산가</h4>
              <p data-i18n="createMisangaDesc">매듭으로 짜는 편평한 프렌드십 팔찌</p>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
      <nav class="footer-links">
        <a href="/about" data-i18n="footerAbout">소개</a>
        <a href="/simulator" data-i18n="footerSimulator">시뮬레이터</a>
        <a href="/" data-i18n="footerGallery">갤러리</a>
        <a href="/privacy" data-i18n="footerPrivacy">개인정보처리방침</a>
        <a href="/terms" data-i18n="footerTerms">이용약관</a>
      </nav>
      <p class="footer-copy">© 2025 Palzzi. All rights reserved.</p>
    </footer>
  </div>

  <script type="module" src="src/gallery.js"></script>
</body>
</html>
