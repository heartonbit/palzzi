<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="galleryTitle">Palzzi - 쿠미히모 패턴 갤러리</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="gallery-style.css">
</head>
<body>
  <div class="app-container">

    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="logo-group">
        <div class="logo">
          <i class="fa-solid fa-circle-nodes"></i>
          <h1><span class="logo-text" data-i18n="logoTitle">Palzzi</span></h1>
        </div>
        <div class="lang-selector">
          <button id="btn-lang-ko" class="lang-btn active">KO</button>
          <button id="btn-lang-en" class="lang-btn">EN</button>
        </div>
      </div>
      <div class="header-actions">
        <div id="auth-area" class="auth-area">
          <!-- Auth UI dynamically populated by gallery.js -->
        </div>
        <a href="/simulator" class="btn-create-sim" title="시뮬레이터에서 만들기">
          <i class="fa-solid fa-plus"></i>
        </a>
      </div>
    </header>

    <!-- Gallery Workspace -->
    <main class="workspace">

      <!-- Gallery Grid Area -->
      <section class="gallery-area">
        <div class="gallery-header">
          <h2 data-i18n="galleryHeading"><i class="fa-solid fa-images"></i> 쿠미히모 패턴 갤러리</h2>
          <p class="gallery-subtitle" data-i18n="gallerySubtitle">Firebase에 저장된 쿠미히모 패턴을 감상하고 클릭하여 상세 정보를 확인하세요.</p>
        </div>

        <!-- Loading / Empty states -->
        <div id="gallery-loading" class="gallery-state">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <p data-i18n="loadingPatterns">패턴을 불러오는 중...</p>
        </div>
        <div id="gallery-empty" class="gallery-state hidden">
          <i class="fa-solid fa-folder-open"></i>
          <p data-i18n="noPatterns">아직 저장된 패턴이 없습니다.</p>
          <a href="/simulator" class="btn btn-primary" data-i18n="createFirst">
            <i class="fa-solid fa-plus"></i> 첫 패턴 만들기
          </a>
        </div>

        <!-- Gallery Grid -->
        <div id="gallery-grid" class="gallery-grid hidden">
          <!-- Dynamically populated pattern cards -->
        </div>
      </section>

      <!-- Detail Panel (slides in from right on card click) -->
      <aside id="detail-panel" class="detail-panel hidden">
        <div class="detail-header">
          <h3 data-i18n="detailTitle">패턴 상세 정보</h3>
          <button id="btn-close-detail" class="btn-close-detail" title="닫기">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="detail-body">
          <!-- Pattern preview canvas -->
          <div class="detail-preview">
            <canvas id="detail-canvas" width="320" height="200"></canvas>
          </div>
          <!-- Pattern metadata -->
          <div class="detail-meta">
            <div class="meta-row">
              <span class="meta-label" data-i18n="metaPatternName">패턴 이름</span>
              <span id="detail-name" class="meta-value">-</span>
            </div>
            <div class="meta-row">
              <span class="meta-label" data-i18n="metaThreads">가닥 수</span>
              <span id="detail-threads" class="meta-value">-</span>
            </div>
            <div class="meta-row">
              <span class="meta-label" data-i18n="metaThreadLength">20cm 팔찌 실 길이</span>
              <span id="detail-thread-length" class="meta-value">-</span>
            </div>
            <div class="meta-row">
              <span class="meta-label" data-i18n="metaCreator">만든 이</span>
              <span id="detail-creator" class="meta-value">-</span>
            </div>
            <div class="meta-row">
              <span class="meta-label" data-i18n="metaCreatedAt">생성일</span>
              <span id="detail-created" class="meta-value">-</span>
            </div>
          </div>
          <!-- Color swatches -->
          <div class="detail-colors">
            <h4 data-i18n="colorSwatches">사용 색상</h4>
            <div id="detail-color-list" class="color-swatches">
              <!-- Dynamically populated -->
            </div>
          </div>
          <!-- Actions -->
          <div class="detail-actions">
            <button id="btn-load-simulator" class="btn btn-primary w-100">
              <i class="fa-solid fa-arrows-spin"></i> <span data-i18n="loadToSimulator">시뮬레이터에서 열기</span>
            </button>
            <button id="btn-delete-pattern" class="btn btn-danger w-100 mt-2">
              <i class="fa-solid fa-trash"></i> <span data-i18n="deletePattern">패턴 삭제</span>
            </button>
          </div>
        </div>
      </aside>

    </main>
  </div>

  <script type="module" src="src/gallery.js"></script>
</body>
</html>
