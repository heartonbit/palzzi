<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico">
  <title>Palzzi - 관리자 관리</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="gallery-style.css">
  <style>
    .admin-container {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .admin-card {
      background: var(--bg-panel);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 24px;
      margin-bottom: 24px;
    }
    .admin-card h2 {
      font-size: 18px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .section-empty {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .section-empty i {
      display: block;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .user-list {
      list-style: none;
    }
    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
    }
    .user-row:last-child {
      border-bottom: none;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .user-avatar-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
    }
    .user-details {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .user-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-email {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .admin-you-badge {
      font-size: 10px;
      background: var(--primary-color);
      color: white;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .user-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .user-last-login {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .btn-role {
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-role-admin {
      background: var(--primary-color);
      color: white;
    }
    .btn-role-admin:hover {
      background: var(--primary-hover);
    }
    .btn-role-admin:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-role-user {
      background: var(--bg-base);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }
    .btn-role-user:hover {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }
    .access-denied {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
    }
    .access-denied i {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
    }
    .admin-loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    .admin-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 9999;
      transition: opacity 0.3s;
    }
    .admin-toast.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="logo-group">
        <a href="/" class="back-link" title="갤러리로 돌아가기">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <a href="/" class="logo-link">
          <div class="logo">
            <img src="/logo.png" alt="Palzzi" class="logo-img">
            <h1><span class="logo-text">Palzzi</span></h1>
          </div>
        </a>
      </div>
      <div class="header-actions">
        <div id="auth-area" class="auth-area"></div>
      </div>
    </header>

    <!-- Admin Content -->
    <main class="admin-container" id="admin-content">
      <div class="admin-loading" id="admin-loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>확인 중...</p>
      </div>
    </main>

  </div>

  <script type="module" src="src/admin.js"></script>
</body>
</html>
